<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wave Hover Nav Labels</title>
<style>
  :root{
    --bg:#0b1220;
    --text:#0f172a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Segoe UI',system-ui,sans-serif;
  }

  .navbar{
    display:flex;
    gap:44px;
    padding:20px 40px;
  }

  /* each label is a link containing individually-wrapped <span> letters */
  .nav-label{
    position:relative;
    text-decoration:none;
    font-weight:700;
    font-size:17px;
    color:var(--text);
    display:inline-flex;
    overflow:hidden; /* clips the letters as they travel up out of view */
    height:1.3em;
    line-height:1.3em;
  }

  .nav-label .letter{
    display:inline-block;
    transform:translateY(0);
    transition:transform .35s cubic-bezier(.65,0,.35,1);
  }

  /* stagger each letter's transition-delay so they move in sequence,
     creating the left-to-right wave rather than moving as one block */
  .nav-label:hover .letter{
    transform:translateY(-1.3em);
  }

  /* JS assigns --i (the letter's index) to each span; delay scales off it */
  .nav-label .letter{
    transition-delay: calc(var(--i) * 35ms);
  }

  .hero{
    position:fixed;
    bottom:60px;
    left:0;
    right:0;
    text-align:center;
    color:#64748b;
    font-size:14px;
    padding:0 40px;
  }
</style>
</head>
<body>

<nav class="navbar" id="navbar">
  <a href="#" class="nav-label" data-text="Music">Music</a>
  <a href="#" class="nav-label" data-text="Tour">Tour</a>
  <a href="#" class="nav-label" data-text="About">About</a>
  <a href="#" class="nav-label" data-text="Journey">Journey</a>
  <a href="#" class="nav-label" data-text="Gallery">Gallery</a>
  <a href="#" class="nav-label" data-text="News">News</a>
  <a href="#" class="nav-label" data-text="Contact">Contact</a>
</nav>

<div class="hero">Hover any label — letters rise one after another, then fall back the same way on mouse-leave.</div>

<script>
  // Build each label out of two stacked copies of the letters:
  // one visible row, one identical row directly beneath it.
  // On hover the whole stack shifts up by one line-height, so the
  // bottom row slides into view — giving a seamless "swap" rather
  // than letters disappearing off the top.
  document.querySelectorAll('.nav-label').forEach(label => {
    const text = label.dataset.text;
    label.innerHTML = '';

    const buildRow = () => {
      const row = document.createElement('span');
      row.style.display = 'inline-block';
      [...text].forEach((ch, i) => {
        const span = document.createElement('span');
        span.className = 'letter';
        span.style.setProperty('--i', i);
        span.textContent = ch === ' ' ? '\u00A0' : ch;
        row.appendChild(span);
      });
      return row;
    };

    const wrap = document.createElement('span');
    wrap.style.display = 'inline-flex';
    wrap.style.flexDirection = 'column';

    wrap.appendChild(buildRow());
    wrap.appendChild(buildRow());

    label.appendChild(wrap);
  });
</script>

</body>
</html>
